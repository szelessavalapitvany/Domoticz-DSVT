<script>
	if (typeof window.TranslationLoader === 'undefined') {

		class TranslationLoader {
			constructor() {
				this.translations = {};

				//	Promise, amit minden más kód megvárhat
				this.loaded = this.loadTranslations().then(t => {
					this.translations = t || {};
					if (!$.isEmptyObject(this.translations)) {
						this.translatePage();
					} else {
						console.error("Hiba: üres vagy hiányos fordítási fájl!");
					}
				});
			}

			async loadTranslations() {

				//	Ellenőrzés, hogy a szükséges változók léteznek-e
				if (typeof proto === 'undefined' || typeof address === 'undefined' || typeof port === 'undefined') {
					console.error("Hiányzik a 'proto', 'address' vagy 'port' változó.");
					return {};
				}

				let aktlanguage;

				const settingsUrl = `${proto}${address}:${port.toString()}/json.htm?type=command&param=getsettings`;

				try {
					const response = await fetch(settingsUrl);
					if (!response.ok) throw new Error('Hálózati hiba történt');
					const data = await response.json();
					aktlanguage = data.Language;
				} catch (error) {
					console.error('Hiba a beállítások lekérése közben:', error);
					return {};
				}

				const filePath = `/templates/dsvt_html_translate_${aktlanguage}.json`;

				try {
					const response = await $.getJSON(filePath);
					return response;
				} catch (error) {
					console.error(`Hiba történt a '${filePath}' fájl betöltése közben: ${error}`);
					return {};
				}
			}

			t(text) {
				return this.translations[text] || text;
			}

			translatePage() {
				$('[data-translate]').each((index, element) => {
					const key = $(element).data('translate');
					const translation = this.t(key);
					$(element).text(translation);
				});
				console.log("Oldal sikeresen lefordítva.");
			}
		}

		window.TranslationLoader = TranslationLoader;

	}
</script>

				const labelLowH = document.createElement('label');
				labelLowH.innerText = translationLoader.t("Dynamic limit (lower)") + ':';
				labelLowH.setAttribute('for', `Hhatarlow_${i}_${z}`);
				labelLowH.style.marginLeft = '20px';
				labelLowH.classList.add('label-normal');
				klimaExtraRowH.appendChild(labelLowH);

				const inputLowH = document.createElement('input');
				inputLowH.type = 'text';
				inputLowH.maxLength = 3;
				inputLowH.id = `Hhatarlow_${i}_${z}`;
				inputLowH.name = `Hhatarlow_${i}_${z}`;
				inputLowH.classList.add('input-20');
				inputLowH.value = klimaBaseRowH.hatar_low ?? 0;
				klimaExtraRowH.appendChild(inputLowH);

				// ---- Szabályozási felső határ ----
				const labelTopH = document.createElement('label');
				labelTopH.innerText = translationLoader.t("Dynamic limit (upper)") + ':';
				labelTopH.setAttribute('for', `Hhatartop_${i}_${z}`);
				labelTopH.style.marginLeft = '20px';
				labelTopH.classList.add('label-normal');
				klimaExtraRowH.appendChild(labelTopH);

				const inputTopH = document.createElement('input');
				inputTopH.type = 'text';
				inputTopH.maxLength = 3;
				inputTopH.id = `Hhatartop_${i}_${z}`;
				inputTopH.name = `Hhatartop_${i}_${z}`;
				inputTopH.classList.add('input-20');
				inputTopH.value = klimaBaseRowH.hatar_top ?? 2;
				klimaExtraRowH.appendChild(inputTopH);

				const klimaCheckboxRowH = document.createElement('div');
				klimaCheckboxRowH.classList.add('klimaCheckboxRowH');

				// ---- Target Off (checkbox) ----
				const labelTargetOffH = document.createElement('label');
				labelTargetOffH.innerText = translationLoader.t("Target Off") + ':';
				labelTargetOffH.classList.add('label-normal');
				klimaCheckboxRowH.appendChild(labelTargetOffH);

				const inputTargetOffH = document.createElement('input');
				inputTargetOffH.type = 'checkbox';
				inputTargetOffH.id = `Htarget_off_${i}_${z}`;
				inputTargetOffH.name = `Htarget_off_${i}_${z}`;
				inputTargetOffH.checked = (klimaBaseRowH.target_off === true);
				inputTargetOffH.style.marginLeft = "5px";
				klimaCheckboxRowH.appendChild(inputTargetOffH);

				// ---- Disabled when present (dropdown) ----
				const labelPresenceOffH = document.createElement('label');
				labelPresenceOffH.innerText = translationLoader.t("In case of presence") + ':';
				labelPresenceOffH.style.marginLeft = "20px";
				labelPresenceOffH.classList.add('label-normal');
				klimaCheckboxRowH.appendChild(labelPresenceOffH);

				const selectPresenceOffH = document.createElement('select');
				selectPresenceOffH.id = `HAC_jelenlet_${i}_${z}`;
				selectPresenceOffH.name = `HAC_jelenlet_${i}_${z}`;
				selectPresenceOffH.style.marginLeft = "5px";

				["None", "Off", "On"].forEach(v => {
					const option = document.createElement('option');
					option.value = v;
					option.textContent = v;
					selectPresenceOffH.appendChild(option);
				});

				// aktuális érték beállítása
				selectPresenceOffH.value =
					klimaBaseRowH.AC_jelenlet === "On" ? "On" :
					klimaBaseRowH.AC_jelenlet === "Off" ? "Off" :
					"None";

				klimaCheckboxRowH.appendChild(selectPresenceOffH);


				// --- Hozzáadás a H tartalomhoz ---
				klimaContentH.appendChild(klimaExtraRowH);
				klimaContentH.appendChild(klimaCheckboxRowH);

				zoneBlock.appendChild(klimaWrapperH);

				// Virtuális hidraulikus váltó

				dropBlockConfigs.push({
					mode: 'Mode3',
					title: "Virtual hydraulic shifter cooling",
					link: "➕ Add virtual hydraulic shifter",
					forparam: "switchnameakt",
					modePrefix: `Z_${z}_H_V`,
					targetId: `virtualh_add_${z}`,
					datasetKey: `vh_${z}`,
					inputName: `virtualh_id_${z}`
				});
				createDropBlock(dsvt, i, dropBlockConfigs.at(-1), zoneBlock);


				if (base_ids[z]) {
					const setpointWrapper = document.createElement('div');
					setpointWrapper.classList.add('setpoint-wrapper');
					setpointWrapper.style.marginTop = '15px';

					const setpointTitle = document.createElement('h2');
					setpointTitle.innerText = translationLoader.t("Setpoint configuration");
					setpointWrapper.appendChild(setpointTitle);
					setpointWrapper.appendChild(document.createElement('br'));


					base_ids[z].forEach((unit, index) => {
						const row = document.createElement('div');
						row.style.display = 'flex';
						row.style.alignItems = 'center';
						row.style.gap = '10px';
						row.style.marginBottom = '8px';

						// Egyezés keresése Unit (parts[0]) alapján
						const match = dsvt[i].setpointnameakt.find(entry => {
							const parts = entry.split(':');
							return parseInt(parts[0]) === unit;
						});

						let name = '—';
						let value = '';
						if (match) {
							const parts = match.split(':');
							name = parts[1];  // név
							value = parts[3]; // érték
						}

						// Név input
						const nameInput = document.createElement('input');
						nameInput.type = 'text';
						nameInput.value = name;
						nameInput.classList.add('setpoint-name');
						nameInput.id = `setpoint_name_${i}_${z}_${index}`;
						row.appendChild(nameInput);

						// Érték input (szám)
						const valueInput = document.createElement('input');
						valueInput.type = 'number';
						valueInput.step = '0.1';
						valueInput.value = value;
						valueInput.id = `setpoint_value_${i}_${z}_${index}`;
						valueInput.classList.add('setpoint-number');
						row.appendChild(valueInput);

						// Celsius egység
						const unitSpan = document.createElement('span');
						unitSpan.innerText = '°C';
						row.appendChild(unitSpan);

						setpointWrapper.appendChild(row);
					});

					zoneBlock.appendChild(setpointWrapper);
				}
			}

		hideSaveStatus();

		// adatgyujtes ---------------------------------------------------------

		var table = document.createElement('table');
		table.setAttribute('style', 'border-spacing: 5px; width:100%');
		document.getElementById('dsvt_hmv_zone_12_content').appendChild(table);
		var row = table.insertRow();
		var cell1 = row.insertCell(0);
		var cell2 = row.insertCell(1);
		var cell3 = row.insertCell(2);
		var cell4 = row.insertCell(3);

		var submitButton = document.createElement('input');
		submitButton.setAttribute('type', 'submit');
		submitButton.classList.add('save-data');
		submitButton.setAttribute('value', translationLoader.t("Save"));
		submitButton.setAttribute('id', 'submitBtn_' + i);
		cell2.appendChild(submitButton);

		document.getElementById('submitBtn_' + i).addEventListener('click', (function (i_copy) {

			return function () {
				let mode1List = [], mode2List = [], mode3List = [], mode4List = [], mode5List = [];
				let setpointUpdates = [];
				let data = {
					Mode1: [], Mode2: [], Mode3: [],
					Mode4: [], Mode5: [], Mode6: []
				};

				for (var j = 0; j < 6; j++) {
					let el = document.getElementById('text_' + j + '_mode6_' + i_copy);
					if (el) data.Mode6.push(el.value);
				}

				dropBlockConfigs.forEach(cfg => {
					let zone = document.getElementById(cfg.targetId+'_'+i_copy);
					if (!zone || !zone.dataset[cfg.datasetKey]) return;

					let ids = zone.dataset[cfg.datasetKey].split(',').filter(Boolean);
					ids.forEach(id => {
						let item = cfg.modePrefix ? `${cfg.modePrefix}:${id}` : id;
						switch (cfg.mode) {
							case 'Mode1': mode1List.push(item); break;
							case 'Mode2': mode2List.push(item); break;
							case 'Mode3': mode3List.push(item); break;
							case 'Mode4': mode4List.push(item); break;
							case 'Mode5': mode5List.push(item); break;
						}
					});
				});

				for (let z = 1; z <= 12; z++) {
					if (!base_ids[z]) continue;

					base_ids[z].forEach((unit, index) => {
						let match = dsvt[i_copy].setpointnameakt.find(entry => parseInt(entry.split(':')[0]) === unit);
						if (!match) return;

						let [_, originalName, originalIdx, originalValue] = match.split(':');
						let nameInput = document.getElementById(`setpoint_name_${i_copy}_${z}_${index}`);
						let valueInput = document.getElementById(`setpoint_value_${i_copy}_${z}_${index}`);
						if (!nameInput || !valueInput) return;

						let currentName = nameInput.value.trim();
						let currentValue = parseFloat(valueInput.value.trim());
						let originalValFloat = parseFloat(originalValue);

						if (originalName !== currentName || Math.abs(currentValue - originalValFloat) > 0.001) {
							setpointUpdates.push({
								idx: parseInt(originalIdx),
								name: currentName,
								value: currentValue
							});
						}
					});
				}

				const port = window.location.port ? ":" + window.location.port : "";
				const mode1QueryString = "Mode1=" + encodeURIComponent(mode1List.join(','));
				const mode2QueryString = "Mode2=" + encodeURIComponent(mode2List.join(','));
				const mode3QueryString = "Mode3=" + encodeURIComponent(mode3List.join(','));
				const mode4QueryString = "Mode4=" + encodeURIComponent(mode4List.join(','));
				const mode5QueryString = "Mode5=" + encodeURIComponent(mode5List.join(','));
				const mode6QueryString = "Mode6=" + encodeURIComponent(data.Mode6.join(','));

				const url = `${window.location.protocol}//${window.location.hostname}${port}/json.htm?type=command&param=updatehardware&htype=94&loglevel=7&extra=DSVT_HMV_ZONE_12&idx=${dsvt[i_copy].id}&enabled=true&datatimeout=0&name=${dsvt[i_copy].name}&address=${dsvt[i_copy].host}&port=${dsvt[i_copy].port}&username=${dsvt[i_copy].uname}&password=${dsvt[i_copy].pass}&${mode1QueryString}&${mode2QueryString}&${mode3QueryString}&${mode4QueryString}&${mode5QueryString}&${mode6QueryString}`;
				
				showSaveStatus();
				logToScreen("Elindult");

				for (let z = 1; z <= 12; z++) {
					["F", "H"].forEach(tipus => {
						const varname = `${dsvt[i_copy].name}_Z_${z}_AC_${tipus}`;
						const vendor = document.getElementById(`${tipus}vendor_${i_copy}_${z}`)?.value;
						const ip = document.getElementById(`${tipus}ip_${i_copy}_${z}`)?.value;
						const fanspeed = document.getElementById(`${tipus}fanspeed_${i_copy}_${z}`)?.value;
						const swingv = document.getElementById(`${tipus}swingv_${i_copy}_${z}`)?.value;
						const swingh = document.getElementById(`${tipus}swingh_${i_copy}_${z}`)?.value;
						const komp = document.getElementById(`${tipus}komp_${i_copy}_${z}`)?.value;
						const hatar_low = document.getElementById(`${tipus}hatarlow_${i_copy}_${z}`)?.value;
						const hatar_top = document.getElementById(`${tipus}hatartop_${i_copy}_${z}`)?.value;
						const target_off = document.getElementById(`${tipus}target_off_${i_copy}_${z}`)?.checked ? true : false;
						const AC_jelenlet = document.getElementById(`${tipus}AC_jelenlet_${i_copy}_${z}`)?.value || "None";

						if (vendor === undefined || ip === undefined || fanspeed === undefined ||
							swingv === undefined || swingh === undefined ||
							komp === undefined || hatar_low === undefined || hatar_top === undefined)
							return;

						const jsonData = {
							type: vendor,
							IP: ip,
							fanspeed: fanOptions.indexOf(fanspeed),
							swingv: swingVOptions.indexOf(swingv),
							swingh: swingHOptions.indexOf(swingh),
							komp: Number(komp),
							hatar_low: Number(hatar_low),
							hatar_top: Number(hatar_top),
							target_off: target_off,
							AC_jelenlet: AC_jelenlet
						};

						const value = JSON.stringify(jsonData);
						const setvarurl = `${window.location.protocol}//${window.location.hostname}${port}/json.htm?type=command&param=updateuservariable&vname=${encodeURIComponent(varname)}&vtype=2&vvalue=${encodeURIComponent(value)}`;

						//console.log("Küldés:", setvarurl);
						try {
							const xhr = new XMLHttpRequest();
							xhr.open("GET", setvarurl, false); // szinkron
							xhr.send();
						} catch (e) {
							console.error("Hiba a uservariable mentésnél:", e);
						}
					});
				}



				function sendRequest(url) {
					console.log("sendRequest elindult:", url);
					try {
						const xhr = new XMLHttpRequest();
						xhr.open("GET", url, true);
						xhr.send();
						showLogStatus();
						console.log("Updatehardware elkuldve.");
						logToScreen("Updatehardware elkuldve.");
					} catch (e) {
						console.error("Hiba a sendRequest-ben:", e);
						logToScreen("Updatehardware elkuldve.");
					}
				}

				function sendSetpointUpdatesSequentiallyWithDelay(updates, callback) {

					if (!updates || updates.length === 0) {
						callback();
						return;
					}

					const update = updates.shift();
					const idx_copy = update.idx;
					const maxRetries = 3;
					let attempt = 0;

					function trySend() {
						attempt++;
						logToScreen(`(${idx_copy}) Próbálkozás ${attempt}/${maxRetries}: ${update.name} → ${update.value}°C`);

						const setpointurl = `${window.location.protocol}//${dsvt[i_copy].uname}:${dsvt[i_copy].pass}@${window.location.hostname}${port}/json.htm?type=setused&idx=${update.idx}&name=${encodeURIComponent(update.name)}&setpoint=${encodeURIComponent(update.value)}&protected=false&used=true`;

						const xhr = new XMLHttpRequest();
						let completed = false;

						xhr.open("GET", setpointurl, true);

						xhr.onreadystatechange = function () {
							if (xhr.readyState === 4) {
								completed = true;
								if (xhr.status === 200) {
									logToScreen(`(${idx_copy}) Sikeres küldés.`);
									setTimeout(() => {
										sendSetpointUpdatesSequentiallyWithDelay(updates, callback);
									}, 1000);
								} else {
									logToScreen(`(${idx_copy}) Hiba: ${xhr.status}`);
									retryOrSkip();
								}
							}
						};

						xhr.onerror = function () {
							logToScreen(`(${idx_copy}) Hálózati hiba`);
							retryOrSkip();
						};

						function retryOrSkip() {
							if (attempt < maxRetries) {
								setTimeout(() => trySend(), 5000); // újrapróbálkozás kis késleltetéssel
							} else {
								logToScreen(`(${idx_copy}) Túl sok hiba, kihagyva.`);
								setTimeout(() => {
									sendSetpointUpdatesSequentiallyWithDelay(updates, callback);
								}, 1000);
							}
						}

						try {
							xhr.send();
							setTimeout(() => {
								if (!completed) {
									logToScreen(`(${idx_copy}) Timeout történt`);
									retryOrSkip();
								}
							}, 3000);
						} catch (e) {
							logToScreen(`(${idx_copy}) Kivétel: ${e.message}`);
							retryOrSkip();
						}
					}

					trySend();
				}

				sendRequest(url);

				setTimeout(() => {
					sendSetpointUpdatesSequentiallyWithDelay([...setpointUpdates], () => {
						console.log("Minden setpoint frissitve...");
						logToScreen("Minden setpoint frissítve.");
						setTimeout(() => {
							logToScreen("Frissítés kész, újratöltés...");
							location.reload();
						}, 1000);
					});
				}, 5000);
			};

		})(i));

	}
}
});
</script>
