<script>
	if (typeof window.TranslationLoader === 'undefined') {

		class TranslationLoader {
			constructor() {
				this.translations = {};

				//	Promise that other code can await | Promise, amelynek teljesülését a többi kód megvárhatja
				this.loaded = this.loadTranslations().then(t => {
					this.translations = t || {};
					if (!$.isEmptyObject(this.translations)) {
						this.translatePage();
					} else {
						console.error("Translation file is empty or incomplete! | A fordítási fájl üres vagy hiányos!");
					}
				});
			}

			async loadTranslations() {

				//	Check whether the required variables exist | A szükséges változók létezésének ellenőrzése
				if (typeof proto === 'undefined' || typeof address === 'undefined' || typeof port === 'undefined') {
					console.error("Missing the 'proto', 'address' or 'port' variable. | Hiányzik a 'proto', 'address' vagy 'port' változó.");
					return {};
				}

				let aktlanguage;

				const settingsUrl = `${proto}${address}:${port.toString()}/json.htm?type=command&param=getsettings`;

				try {
					const response = await fetch(settingsUrl);
					if (!response.ok) throw new Error('Network error occurred | Hálózati hiba történt');
					const data = await response.json();
					aktlanguage = data.Language;
				} catch (error) {
					console.error('Error while retrieving settings | Hiba a beállítások lekérése közben:', error);
					return {};
				}

				const filePath = `/templates/dsvt_html_translate_${aktlanguage}.json`;

				try {
					const response = await $.getJSON(filePath);
					return response;
				} catch (error) {
					console.error(`Error loading file '${filePath}': ${error} | Hiba történt a '${filePath}' fájl betöltése közben: ${error}`);
					return {};
				}
			}

			t(text) {
				return this.translations[text] || text;
			}

			translatePage() {
				$('[data-translate]').each((index, element) => {
					const key = $(element).data('translate');
					const translation = this.t(key);
					$(element).text(translation);
				});
				console.log("Page translation completed successfully. | Az oldal fordítása sikeresen befejeződött.");
			}
		}

		window.TranslationLoader = TranslationLoader;

	}
</script>

	// Verify plugin hardware by Extra, then read its Unit 87 status device | A plugin hardverének ellenőrzése Extra alapján, majd a 87-es Unit állapoteszközének olvasása
	async function getDsvtPluginStatus(hardwareId) {
		const controller = new AbortController();
		const timeout = setTimeout(() => controller.abort(), 5000);
		try {
			const hardwareResponse = await fetch(`${window.location.origin}/json.htm?type=command&param=gethardware`, {signal: controller.signal, cache: 'no-store'});
			if (!hardwareResponse.ok) throw new Error(`Hardware HTTP ${hardwareResponse.status}`);
			const hardwareData = await hardwareResponse.json();
			const hardwares = Array.isArray(hardwareData.result) ? hardwareData.result : [];
			const matchingHardware = hardwares.filter(hw => hw.Extra === 'DSVT_HMV_ZONE_12' && String(hw.idx) === String(hardwareId));
			if (matchingHardware.length !== 1) {
				console.warn('DSVT hardware not found by Extra and hardware ID | DSVT hardver nem található Extra és hardverazonosító alapján:', hardwareId);
				return null;
			}
			const deviceResponse = await fetch(`${window.location.origin}/json.htm?type=command&param=getdevices&filter=all&used=all`, {signal: controller.signal, cache: 'no-store'});
			if (!deviceResponse.ok) throw new Error(`Devices HTTP ${deviceResponse.status}`);
			const deviceData = await deviceResponse.json();
			const devices = Array.isArray(deviceData.result) ? deviceData.result : [];
			const matches = devices.filter(device => String(device.HardwareID) === String(hardwareId) && Number(device.Unit) === 87);
			if (matches.length !== 1) {
				console.warn('Plugin status device not found uniquely | Nem található egyértelműen a plugin állapoteszköze:', {hardwareId, matches: matches.length});
				return null;
			}
			return String(matches[0].Data ?? matches[0].sValue ?? '').trim();
		} catch (error) {
			console.warn('Plugin status request failed | Pluginállapot lekérése sikertelen:', error);
			return null;
		} finally {
			clearTimeout(timeout);
		}
	}

	async function isDsvtReady(hardwareId) {
		if (await getDsvtPluginStatus(hardwareId) !== 'READY') return false;
		await new Promise(resolve => setTimeout(resolve, 2000));
		return await getDsvtPluginStatus(hardwareId) === 'READY';
	}

				chooserToggle.addEventListener('click', () => {

				});

				chooserBox.querySelectorAll('.device').forEach(dev => {
					dev.addEventListener('dragstart', e => {
						e.dataTransfer.setData('id', dev.dataset.id);
						e.dataTransfer.setData('label', dev.dataset.label);
						e.dataTransfer.setData('target', dev.dataset.target);
						e.dataTransfer.setData('unit', dev.dataset.unit);
					});
				});

				dropZone.addEventListener('dragover', e => {
					e.preventDefault();
					dropZone.classList.add('dragover');
				});
				dropZone.addEventListener('dragleave', () => {
					dropZone.classList.remove('dragover');
				});
				dropZone.addEventListener('drop', e => {
					e.preventDefault();
					dropZone.classList.remove('dragover');
					const id = e.dataTransfer.getData('id');
					const label = e.dataTransfer.getData('label');
					const target = e.dataTransfer.getData('target');
					const unit = e.dataTransfer.getData('unit');

					if (dropZone.id !== target) return;

					let currentIds = dropZone.dataset[datasetKey] ? dropZone.dataset[datasetKey].split(',') : [];
					if (!currentIds.includes(id)) {
						let chip = createChip(unit, label, id, dropZone, hiddenInput, datasetKey, false);
						dropZone.appendChild(chip);
						currentIds.push(id);
						dropZone.dataset[datasetKey] = currentIds.join(',');
						hiddenInput.value = currentIds.join(',');
					}
				});

				// Restore saved IDs from the correct source | Mentett azonosítók visszaolvasása a megfelelő forrásból
				const modeRaw = typeof dsvt[i]?.[mode] === 'string' ? dsvt[i][mode] : '';
				const savedItems = modeRaw.split(',').map(item => item.trim()).filter(Boolean);
				const sourceEntries = (modePrefix === 'N' || modePrefix === 'O') ? [] : (Array.isArray(dsvt[i][forparam]) ? dsvt[i][forparam] : []);
				const sourceById = new Map(sourceEntries.map(entry => { const parts = String(entry).split(':'); return [parts[2], {unit:parts[0], label:parts[1], id:parts[2]}]; }));
				const ids = [];
				savedItems.forEach(item => {
					const separator = item.indexOf(':');
					if (separator < 0) return;
					const prefix = item.slice(0, separator);
					const id = item.slice(separator + 1);
					// Accept legacy L switch entries when migrating to LS | Régi L kapcsolók elfogadása LS-re áttéréskor
					if (prefix !== modePrefix && !(modePrefix === 'LS' && prefix === 'L')) return;
					let entry;
					if (modePrefix === 'N' || modePrefix === 'O') {
						const option = Array.from(chooserBox.querySelectorAll('.device')).find(dev => dev.dataset.id === id);
						if (!option) return;
						entry = {unit:'', label:option.dataset.label, id};
					} else {
						entry = sourceById.get(id);
						if (!entry) return;
					}
					if (ids.includes(id)) return;
					const chip = createChip(entry.unit, entry.label, id, dropZone, hiddenInput, datasetKey, false);
					dropZone.appendChild(chip);
					ids.push(id);
				});
				dropZone.dataset[datasetKey] = ids.join(',');
				hiddenInput.value = ids.join(',');
			}

			function createChip(unit, label, id, dropZone, hiddenInput, datasetKey, draggable = true) {
				const chip = document.createElement('div');
				chip.className = 'device';
				chip.innerHTML = `${label} (idx: ${id}) <span class="remove-x" style="color:red; cursor:pointer; margin-left:8px;">✖</span>`;
				chip.dataset.id = id;

				if (draggable) {
					chip.setAttribute('draggable', 'true');
					chip.addEventListener('dragstart', e => {
						e.dataTransfer.setData('remove-id', id);
					});
					chip.addEventListener('dragend', e => {
						if (!dropZone.contains(chip)) {
							chip.remove();
							let updatedIds = dropZone.dataset[datasetKey].split(',').filter(existingId => existingId !== id);
							dropZone.dataset[datasetKey] = updatedIds.join(',');
							hiddenInput.value = updatedIds.join(',');
						}
					});
				}

				chip.querySelector('.remove-x').addEventListener('click', e => {
					e.stopPropagation();
					chip.remove();
					let updatedIds = dropZone.dataset[datasetKey].split(',').filter(existingId => existingId !== id);
					dropZone.dataset[datasetKey] = updatedIds.join(',');
					hiddenInput.value = updatedIds.join(',');
				});

				return chip;
			}

						if (!response.ok) throw new Error(`HTTP ${response.status}`);
						const body = await response.json();
						if (!body || body.status !== 'OK') throw new Error(`Domoticz status: ${body?.status ?? 'missing'}`);
						return body;
					} finally {
						clearTimeout(timer);
					}
				}

				// Compare the saved device configuration before issuing updatehardware | Mentett eszközkonfiguráció összehasonlítása az updatehardware hívás előtt
				function normalizedMode(value) {
					return String(value ?? '').split(',').map(item => item.trim()).filter(Boolean).sort().join(',');
				}
				const newModes = [mode1List, mode2List, mode3List, mode4List, mode5List].map(list => normalizedMode(list.join(',')));
				const oldModes = [1, 2, 3, 4, 5].map(n => normalizedMode(dsvt[i_copy][`Mode${n}`]));
				const mode6Changed = String(dsvt[i_copy].Mode6 ?? '') !== data.Mode6.join(',');
				const hardwareChanged = mode6Changed || newModes.some((value, index) => value !== oldModes[index]);

				// Only update air-conditioner variables whose actual values changed | Csak a ténylegesen megváltozott klímaváltozók frissítése
				const climateUpdates = [];
				for (let z = 1; z <= 12; z++) {
					for (const tipus of ['F', 'H']) {
						const field = suffix => document.getElementById(`${tipus}${suffix}_${i_copy}_${z}`);
						const vendor = field('vendor')?.value;
						const ip = field('ip')?.value;
						const fan = field('fanspeed')?.value;
						const swingv = field('swingv')?.value;
						const swingh = field('swingh')?.value;
						const komp = field('komp')?.value;
						const low = field('hatarlow')?.value;
						const top = field('hatartop')?.value;
						if ([vendor, ip, fan, swingv, swingh, komp, low, top].some(v => v === undefined)) continue;

						const jsonData = {
							type: vendor, IP: ip,
							fanspeed: fanOptions.indexOf(fan),
							swingv: swingVOptions.indexOf(swingv),
							swingh: swingHOptions.indexOf(swingh),
							komp: Number(komp), hatar_low: Number(low), hatar_top: Number(top),
							target_off: !!field('target_off')?.checked,
							AC_jelenlet: field('AC_jelenlet')?.value || 'None'
						};
						const original = dsvt[i_copy].klimatabla.find(row => row.zona == z && row.tipus == tipus);
						// Missing records use the same defaults as the form | Hiányzó rekordoknál az űrlap alapértékeit használjuk
						const defaults = {type:'AUTO', IP:'-', fanspeed:0, swingv:0, swingh:0,
							komp:0, hatar_low:0, hatar_top: tipus === 'H' ? 2 : 0,
							target_off:false, AC_jelenlet:'None'};
						const previous = original || defaults;
						const changed = Object.keys(jsonData).some(key => {
							if (['fanspeed', 'swingv', 'swingh', 'komp', 'hatar_low', 'hatar_top'].includes(key))
								return Number(previous[key] ?? defaults[key]) !== jsonData[key];
							if (key === 'target_off') return (previous[key] === true) !== jsonData[key];
							return String(previous[key] ?? defaults[key]) !== String(jsonData[key]);
						});
						if (changed) climateUpdates.push({name: `${dsvt[i_copy].name}_Z_${z}_AC_${tipus}`, value: JSON.stringify(jsonData)});
					}
				}

				// Do not restart the plugin when nothing was changed | Változatlan konfiguráció esetén ne indítsuk újra a plugint
				if (!hardwareChanged && climateUpdates.length === 0 && setpointUpdates.length === 0) {
					console.log('No configuration changes | Nincs konfigurációs változás');
					currentSaveButton.disabled = false;
					return;
				}

				const saveButton = document.getElementById('submitBtn_' + i_copy);
				saveButton.disabled = true;
				showSaveStatus();
				showLogStatus();
				logToScreen('Save process started');
				try {
					for (const update of climateUpdates) {
						const query = new URLSearchParams({type:'command', param:'updateuservariable', vname:update.name, vtype:'2', vvalue:update.value});
						await apiRequest(`${window.location.origin}/json.htm?${query}`);
						console.log('Climate variable updated | Klímaváltozó frissítve:', update.name);
					}

					// Update setpoints before hardware reconfiguration can restart the plugin | Célhőmérsékletek mentése a plugin újraindítását kiváltó konfigurációfrissítés előtt
					for (const update of setpointUpdates) {
						const query = new URLSearchParams({type:'command', param:'setused', idx:String(update.idx), name:update.name, setpoint:String(update.value), protected:'false', used:'true'});
						await apiRequest(`${window.location.origin}/json.htm?${query}`);
						logToScreen('({idx}) Request sent successfully', {idx:update.idx});
					}

					if (hardwareChanged) {
						logToScreen('Updatehardware request sent');
						await apiRequest(url);
					}
					logToScreen('All setpoints updated');
					logToScreen('Update complete, reloading page...');
					location.reload();
				} catch (error) {
					// Keep the page available for diagnostics instead of reloading on error | Hiba esetén maradjon nyitva az oldal a diagnosztikához
					console.error('Save failed | Mentési hiba:', error);
					console.error('Save failed | Mentés sikertelen:', error.message);
					logToScreen('Save failed | A mentés sikertelen');
					const spinner = document.querySelector('#saveStatus .spin-icon');
					if (spinner) spinner.style.display = 'none';
					const closeButton = document.createElement('button');
					closeButton.type = 'button';
					closeButton.textContent = 'Close | Bezárás';
					closeButton.addEventListener('click', () => {
						closeButton.remove();
						if (spinner) spinner.style.display = '';
						hideSaveStatus();
					});
					const logBox = document.getElementById('logOutput');
					if (logBox) logBox.appendChild(closeButton);
					if (await isDsvtReady(dsvt[i_copy].id)) {
					saveButton.disabled = false;
					saveButton.style.display = '';
					readySpinner.style.display = 'none';
				} else {
					void enableSaveWhenReady();
				}
				}

			};

		})(i));

	}
}
});
</script>
